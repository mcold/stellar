<div class="row">
  <div class="col-12">
    <nb-card>
      <nb-card-header class="d-flex justify-content-between align-items-center">
        <h4>Resource Group Usage</h4>
        <div>
          <button
            nbButton
            ghost
            status="basic"
            size="small"
            class="me-2"
            (click)="toggleAutoRefresh()"
            [nbTooltip]="autoRefresh ? 'Disable auto refresh' : 'Enable auto refresh'"
          >
            <nb-icon [icon]="autoRefresh ? 'pause-circle-outline' : 'play-circle-outline'"></nb-icon>
            {{ autoRefresh ? 'Auto refresh' : 'Manual refresh' }}
          </button>
          <button
            nbButton
            status="info"
            size="small"
            class="me-2"
            (click)="refreshData()"
            [disabled]="loading"
            nbTooltip="Refresh data now"
          >
            <nb-icon icon="refresh-outline"></nb-icon>
            Refresh
          </button>
          <button
            nbButton
            ghost
            status="basic"
            size="small"
            (click)="goBack()"
            nbTooltip="Back to resource group list"
          >
            <nb-icon icon="arrow-back-outline"></nb-icon>
            Back
          </button>
        </div>
      </nb-card-header>

      <nb-card-body>
        <div *ngIf="autoRefresh" class="mb-3">
          <nb-alert status="info" size="small">
            <nb-icon icon="info-outline"></nb-icon>
            Auto refresh is on, data is updated every {{ refreshInterval }} seconds
          </nb-alert>
        </div>

        <div *ngIf="loading" class="d-flex justify-content-center p-4">
          <nb-spinner size="large"></nb-spinner>
        </div>

        <angular2-smart-table
          *ngIf="!loading"
          [settings]="settings"
          [source]="source"
        >
        </angular2-smart-table>

        <div *ngIf="!loading && source.count() === 0" class="text-center p-4">
          <nb-icon icon="inbox-outline" class="text-muted" style="font-size: 3rem;"></nb-icon>
          <p class="text-muted mt-2">No resource group is using resources right now</p>
        </div>
      </nb-card-body>
    </nb-card>
  </div>
</div>
