<nb-card class="organization-dialog">
  <nb-card-header>{{ mode === 'create' ? 'Create Organization' : 'Edit Organization' }}</nb-card-header>

  <nb-card-body>
    <form [formGroup]="form" novalidate>
      <!-- Code & Name (create mode) -->
      <div class="form-row" *ngIf="mode === 'create'">
        <div class="form-group">
          <label class="label">Organization code</label>
          <input nbInput fullWidth formControlName="code" placeholder="Lowercase letters, digits, underscores"
            [status]="form.get('code')?.invalid && form.get('code')?.touched ? 'danger' : 'basic'" />
        </div>
        <div class="form-group">
          <label class="label">Organization name</label>
          <input nbInput fullWidth formControlName="name" placeholder="Organization name"
            [status]="form.get('name')?.invalid && form.get('name')?.touched ? 'danger' : 'basic'" />
        </div>
      </div>

      <!-- Name only (edit mode) -->
      <div class="form-row" *ngIf="mode === 'edit'">
        <div class="form-group full">
          <label class="label">Organization name</label>
          <input nbInput fullWidth formControlName="name" placeholder="Organization name"
            [status]="form.get('name')?.invalid && form.get('name')?.touched ? 'danger' : 'basic'" />
        </div>
        </div>

        <!-- Description -->
      <div class="form-row">
        <div class="form-group full">
          <label class="label">Description</label>
          <textarea nbInput fullWidth formControlName="description" placeholder="Organization description (optional)" rows="2"></textarea>
        </div>
        </div>

      <!-- Admin (edit mode) -->
      <div class="form-row" *ngIf="mode === 'edit'">
        <div class="form-group full">
          <label class="label">Admin</label>
          <nb-select formControlName="admin_user_id" placeholder="Select an admin (optional)" fullWidth>
              <nb-option *ngFor="let user of availableUsers; trackBy: trackByUserId" [value]="user.id">
              {{ user.username }} <span class="hint" *ngIf="user.email">- {{ user.email }}</span>
              </nb-option>
            </nb-select>
        </div>
      </div>
    </form>
  </nb-card-body>

  <nb-card-footer>
    <button class="cancel" nbButton status="danger" (click)="cancel()">Cancel</button>
    <button nbButton status="success" (click)="submit()" [disabled]="form.invalid">Save</button>
  </nb-card-footer>
</nb-card>
