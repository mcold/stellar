<nb-card class="user-dialog">
  <nb-card-header>{{ mode === 'create' ? 'Add User' : 'Edit User' }}</nb-card-header>

  <nb-card-body>
    <form [formGroup]="form" novalidate>
      <!-- Organization (Super Admin) -->
      <div class="form-row" *ngIf="isSuperAdmin">
        <div class="form-group full">
          <label class="label">Organization</label>
          <nb-select formControlName="organizationId" placeholder="Select an organization" fullWidth
            [status]="form.get('organizationId')?.invalid && form.get('organizationId')?.touched ? 'danger' : 'basic'">
            <nb-option *ngFor="let org of organizations" [value]="org.id">{{ org.name }}</nb-option>
              </nb-select>
        </div>
          </div>

          <!-- Organization Display (Org Admin) -->
      <div class="form-row" *ngIf="!isSuperAdmin && currentOrganization">
        <div class="form-group full">
            <label class="label">Organization</label>
          <input nbInput fullWidth [value]="currentOrganization.name" disabled />
        </div>
          </div>

      <!-- Username & Email -->
      <div class="form-row">
          <div class="form-group">
          <label class="label">Username</label>
          <input nbInput fullWidth formControlName="username" placeholder="Username"
            [status]="form.get('username')?.invalid && form.get('username')?.touched ? 'danger' : 'basic'" />
          </div>
          <div class="form-group">
          <label class="label">Email</label>
          <input nbInput fullWidth type="email" formControlName="email" placeholder="Email address"
            [status]="form.get('email')?.invalid && form.get('email')?.touched ? 'danger' : 'basic'" />
        </div>
          </div>

      <!-- Password & Confirm -->
      <div class="form-row">
          <div class="form-group">
          <label class="label">Password <span class="hint" *ngIf="mode === 'edit'">(leave blank to keep unchanged)</span></label>
          <input nbInput fullWidth type="password" formControlName="password"
            [placeholder]="mode === 'create' ? 'Password' : 'Leave blank to keep unchanged'"
            [status]="form.get('password')?.invalid && form.get('password')?.touched ? 'danger' : 'basic'" />
          </div>
          <div class="form-group">
          <label class="label">Confirm password</label>
          <input nbInput fullWidth type="password" formControlName="confirmPassword" placeholder="Enter again"
            [status]="(form.get('confirmPassword')?.invalid || form.errors?.['passwordMismatch']) && form.get('confirmPassword')?.touched ? 'danger' : 'basic'" />
        </div>
          </div>

      <!-- Role -->
      <div class="form-row">
        <div class="form-group full">
          <label class="label">Roles</label>
          <nb-select formControlName="roleIds" placeholder="Select roles (multiple allowed)" multiple fullWidth
            [status]="form.get('roleIds')?.invalid && form.get('roleIds')?.touched ? 'danger' : 'basic'">
            <nb-option *ngFor="let role of filteredRoles" [value]="role.id">{{ role.name }}</nb-option>
              </nb-select>
          </div>
      </div>
    </form>
  </nb-card-body>

  <nb-card-footer>
    <button class="cancel" nbButton status="danger" (click)="cancel()">Cancel</button>
    <button nbButton status="success" (click)="submit()" [disabled]="form.invalid || loading">Save</button>
  </nb-card-footer>
</nb-card>
