<nb-card>
  <nb-card-header>
    <div class="d-flex justify-content-between align-items-center">
      <span>User Management</span>
      <button
        nbButton
        status="primary"
        size="small"
        (click)="openCreateUser()"
        [disabled]="!canCreateUser"
        ngxHasPermission="api:users:create"
      >
        <nb-icon icon="person-add-outline"></nb-icon>
        Add user
      </button>
    </div>
  </nb-card-header>

  <nb-card-body>
    <div *ngIf="loading" class="text-center">
      <nb-spinner status="primary"></nb-spinner>
    </div>

    <nb-alert *ngIf="!loading && !hasListPermission" status="warning">
      You do not have permission to view users. Please contact an administrator for authorization.
    </nb-alert>

    <angular2-smart-table
      *ngIf="!loading && hasListPermission"
      [settings]="settings"
      [source]="source"
    ></angular2-smart-table>
  </nb-card-body>
</nb-card>
